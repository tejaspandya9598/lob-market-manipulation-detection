seed: 42
paths:
  raw_dir: data/raw
  submissions_dir: outputs/submissions
data:
  train_file: train_data.csv
  val_file: val_data.csv
  test_file: test_data.csv
features:
  raw:
    - ReturnBid1
    - ReturnAsk1
    - DerivativeReturnBid1
    - DerivativeReturnAsk1
    - BidSize1
    - AskSize1
    - TradeBidSize
    - TradeAskSize
    - CancelledBidSize
    - CancelledAskSize
    - TradeBidIndicator
    - TradeAskIndicator
    - CancelledBidIndicator
    - CancelledAskIndicator
models:
  isolation_forest:
    n_estimators: 300
    max_samples: auto
    contamination: 0.05
    max_features: 1.0
    n_jobs: -1
  autoencoder:
    hidden_dims: [64, 32, 16, 32, 64]
    learning_rate: 0.001
    batch_size: 512
    epochs: 50
    weight_decay: 0.00001
    patience: 7
    dropout: 0.1
  ecod:
    contamination: 0.05
    n_jobs: -1
ensemble:
  weights:
    isolation_forest: 0.20
    autoencoder: 0.20
    ecod: 0.60
